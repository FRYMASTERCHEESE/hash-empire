<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hash Empire - Idle Crypto Miner</title>
<style>
:root{--bg:#0b0f1a;--card:#151c2c;--card2:#1c2538;--accent:#00d4ff;--accent2:#7b61ff;--green:#00e676;--orange:#ffab00;--red:#ff5252;--text:#e8eef7;--muted:#8b9bb4;--border:#2a3548}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;background-image:radial-gradient(ellipse at 20% 20%,rgba(0,212,255,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(123,97,255,.08) 0%,transparent 50%)}
.app{max-width:480px;margin:0 auto;padding:12px;padding-bottom:100px}
.header{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 14px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;box-shadow:0 4px 18px rgba(0,212,255,.35)}
.logo-text h1{font-size:18px;font-weight:700}
.logo-text span{font-size:11px;color:var(--muted)}
.header-btns{display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stats-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center}
.stat-card .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat-card .value{font-size:15px;font-weight:700;margin-top:3px;color:var(--accent)}
.player-section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.player-row{display:flex;align-items:center;gap:14px}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(145deg,#1e2a3e,#0f1520);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 0 20px rgba(0,212,255,.3);flex-shrink:0}
.player-name input{background:transparent;border:none;color:var(--text);font-size:16px;font-weight:700;width:150px;outline:none}
.player-meta{font-size:12px;color:var(--muted);margin-top:3px}
.xp-bar-wrap{margin-top:12px}
.xp-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px}
.xp-bar{height:9px;background:var(--card2);border-radius:5px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:5px;transition:width .4s ease}
.section-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:18px 0 10px 4px}
.coins-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.coin-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;transition:border-color .2s}
.coin-card:active{border-color:var(--accent)}
.coin-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.coin-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.coin-name{font-weight:700;font-size:14px}
.coin-rate{font-size:11px;color:var(--muted)}
.coin-amount{font-size:19px;font-weight:700;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.upgrade-btn{width:100%;padding:10px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),#0099cc);color:#000;font-weight:700;font-size:12px;cursor:pointer}
.upgrade-btn:disabled{background:var(--card2);color:var(--muted)}
.cost{font-size:10px;opacity:.85}
.workers-section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-top:6px}
.workers-visual{display:flex;justify-content:center;gap:6px;margin:12px 0 14px;flex-wrap:wrap;min-height:50px}
.worker{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#2a3548,#1a2233);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px}
.worker.active{border-color:var(--accent);box-shadow:0 0 12px rgba(0,212,255,.35);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.hire-btn{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent2),#5a3fd4);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.hire-btn:disabled{background:var(--card2);color:var(--muted)}
.hire-info{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.prestige-card{background:linear-gradient(135deg,#1a1528,#151c2c);border:1px solid #3d2a6b;border-radius:16px;padding:16px;margin-top:14px;text-align:center}
.prestige-title{font-size:15px;font-weight:700;color:#c4b5fd;margin-bottom:8px}
.prestige-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.prestige-stat{background:rgba(123,97,255,.15);border-radius:10px;padding:9px}
.prestige-stat .ps-label{font-size:10px;color:#a78bfa}
.prestige-stat .ps-value{font-size:16px;font-weight:700;color:#c4b5fd}
.prestige-desc{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.4}
.prestige-btn{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#7b61ff,#a855f7);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.prestige-btn:disabled{background:var(--card2);color:var(--muted)}
.prestige-shop-btn{width:100%;margin-top:8px;padding:11px;border:1px solid #3d2a6b;border-radius:10px;background:transparent;color:#c4b5fd;font-weight:600;font-size:13px;cursor:pointer}
.shop-grid{display:flex;flex-direction:column;gap:10px}
.shop-card{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.shop-card.best{border-color:var(--orange);background:linear-gradient(135deg,#2a1f0a,#1c2538)}
.shop-card.legendary{border-color:#ffd700;background:linear-gradient(135deg,#2a2200,#1c2538)}
.shop-top{display:flex;align-items:center;gap:12px}
.shop-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.shop-name{font-weight:700;font-size:15px}
.shop-desc{font-size:12px;color:var(--muted);margin-top:2px}
.shop-buttons{display:flex;gap:8px}
.shop-price{flex:1;padding:11px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--green),#00c853);color:#000;font-weight:800;font-size:13px;cursor:pointer}
.shop-price.crypto{background:linear-gradient(135deg,#f7931a,#ffb347);color:#000}
.shop-price.owned{background:var(--card);color:var(--muted);border:1px solid var(--border)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,20,32,.96);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 6px 20px;max-width:480px;margin:0 auto;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted);font-size:10px;cursor:pointer;padding:4px 8px}
.nav-item.active{color:var(--accent)}
.nav-item span{font-size:20px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto}
.modal h2{font-size:18px;margin-bottom:12px}
.modal p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:8px}
.modal-close{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:var(--card2);color:var(--text);font-weight:600;cursor:pointer}
.shop-item{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border-radius:12px;padding:12px;margin-bottom:8px}
.shop-item .si-name{font-weight:700;font-size:14px}
.shop-item .si-desc{font-size:11px;color:var(--muted)}
.shop-item button{padding:8px 12px;border:none;border-radius:8px;background:linear-gradient(135deg,#7b61ff,#a855f7);color:#fff;font-weight:700;font-size:12px;cursor:pointer}
.shop-item button:disabled{background:#333;color:#777}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);background:var(--card2);border:1px solid var(--accent);color:var(--text);padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:300;transition:transform .3s;max-width:90%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.toast.show{transform:translateX(-50%) translateY(0)}
.offline-gain{font-size:24px;font-weight:800;color:var(--green);margin:12px 0}
.badge{display:inline-block;background:var(--orange);color:#000;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;margin-left:6px}
.badge.gold{background:#ffd700}
.crypto-box{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px;margin:12px 0;text-align:center}
.crypto-box .addr{font-family:monospace;font-size:11px;word-break:break-all;background:#0d1117;padding:10px;border-radius:8px;margin:6px 0;color:var(--accent);user-select:all}
.pay-options{display:flex;gap:8px;margin-top:10px}
.pay-options button{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer}
.notice{background:rgba(255,171,0,.12);border:1px solid rgba(255,171,0,.35);border-radius:10px;padding:10px;font-size:12px;color:var(--orange);margin-bottom:12px;line-height:1.4}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div class="logo-text"><h1>Hash Empire</h1><span>Idle Crypto Miner</span></div>
    </div>
    <div class="header-btns">
      <button class="icon-btn" onclick="toggleSound()" id="soundBtn">🔊</button>
      <button class="icon-btn" onclick="openModal('stats')">📊</button>
      <button class="icon-btn" onclick="openModal('settings')">⚙️</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-card"><div class="label">Total /min</div><div class="value" id="totalPerMin">$0</div></div>
    <div class="stat-card"><div class="label">Prestige</div><div class="value" id="prestigeLevel">0</div></div>
    <div class="stat-card"><div class="label">Workers</div><div class="value" id="workerCount">0</div></div>
  </div>

  <div class="player-section">
    <div class="player-row">
      <div class="avatar" id="avatar">😎</div>
      <div class="player-info">
        <div class="player-name"><input type="text" id="playerName" value="CryptoBoss" maxlength="14" onchange="saveName()"></div>
        <div class="player-meta">Level <span id="playerLevel">1</span> • PP: <span id="ppDisplay">0</span></div>
      </div>
    </div>
    <div class="xp-bar-wrap">
      <div class="xp-label"><span>XP</span><span id="xpText">0 / 100</span></div>
      <div class="xp-bar"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="section-title">Mining Operations</div>
  <div class="coins-grid" id="coinsGrid"></div>

  <div class="section-title">Mining Team</div>
  <div class="workers-section">
    <div class="workers-visual" id="workersVisual"></div>
    <button class="hire-btn" id="hireBtn" onclick="hireWorker()">Hire Miner</button>
    <div class="hire-info" id="hireInfo">+5% global speed per worker</div>
  </div>

  <div class="prestige-card">
    <div class="prestige-title">🚀 Prestige System</div>
    <div class="prestige-stats">
      <div class="prestige-stat"><div class="ps-label">Current Mult</div><div class="ps-value" id="currentMult">x1.00</div></div>
      <div class="prestige-stat"><div class="ps-label">Prestige Points</div><div class="ps-value" id="ppValue">0</div></div>
    </div>
    <div class="prestige-desc" id="prestigeDesc">Reset for Prestige Points & permanent power.</div>
    <button class="prestige-btn" id="prestigeBtn" onclick="doPrestige()" disabled>Prestige</button>
    <button class="prestige-shop-btn" onclick="openModal('prestigeShop')">🛒 Prestige Shop</button>
  </div>
</div>

<div class="bottom-nav">
  <button class="nav-item active" onclick="showToast('Home')"><span>🏠</span>Home</button>
  <button class="nav-item" onclick="openModal('shop')"><span>🛒</span>Shop</button>
  <button class="nav-item" onclick="openModal('codes')"><span>🎟️</span>Codes</button>
  <button class="nav-item" onclick="openModal('vault')"><span>💰</span>Vault</button>
  <button class="nav-item" onclick="openModal('about')"><span>ℹ️</span>Info</button>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast"></div>

<script>
let audioCtx=null,soundEnabled=true;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playSound(type){
  if(!soundEnabled)return;initAudio();if(audioCtx.state==='suspended')audioCtx.resume();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);const n=audioCtx.currentTime;
  const s={
    upgrade:()=>{o.type='sine';o.frequency.setValueAtTime(520,n);o.frequency.exponentialRampToValueAtTime(780,n+.12);g.gain.setValueAtTime(.15,n);g.gain.exponentialRampToValueAtTime(.001,n+.15);o.start(n);o.stop(n+.15)},
    hire:()=>{o.type='triangle';o.frequency.setValueAtTime(300,n);o.frequency.exponentialRampToValueAtTime(500,n+.2);g.gain.setValueAtTime(.18,n);g.gain.exponentialRampToValueAtTime(.001,n+.25);o.start(n);o.stop(n+.25)},
    prestige:()=>{o.type='sine';o.frequency.setValueAtTime(200,n);o.frequency.exponentialRampToValueAtTime(800,n+.4);g.gain.setValueAtTime(.2,n);g.gain.exponentialRampToValueAtTime(.001,n+.5);o.start(n);o.stop(n+.5)},
    levelup:()=>{o.type='square';o.frequency.setValueAtTime(440,n);o.frequency.setValueAtTime(554,n+.1);o.frequency.setValueAtTime(659,n+.2);g.gain.setValueAtTime(.12,n);g.gain.exponentialRampToValueAtTime(.001,n+.35);o.start(n);o.stop(n+.35)},
    code:()=>{o.type='sine';o.frequency.setValueAtTime(600,n);o.frequency.setValueAtTime(900,n+.08);o.frequency.setValueAtTime(1200,n+.16);g.gain.setValueAtTime(.15,n);g.gain.exponentialRampToValueAtTime(.001,n+.25);o.start(n);o.stop(n+.25)},
    click:()=>{o.type='sine';o.frequency.setValueAtTime(800,n);g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.001,n+.08);o.start(n);o.stop(n+.08)},
    error:()=>{o.type='sawtooth';o.frequency.setValueAtTime(150,n);g.gain.setValueAtTime(.1,n);g.gain.exponentialRampToValueAtTime(.001,n+.2);o.start(n);o.stop(n+.2)},
    shop:()=>{o.type='triangle';o.frequency.setValueAtTime(400,n);o.frequency.exponentialRampToValueAtTime(700,n+.15);g.gain.setValueAtTime(.14,n);g.gain.exponentialRampToValueAtTime(.001,n+.2);o.start(n);o.stop(n+.2)},
    purchase:()=>{o.type='sine';o.frequency.setValueAtTime(523,n);o.frequency.setValueAtTime(659,n+.1);o.frequency.setValueAtTime(784,n+.2);g.gain.setValueAtTime(.18,n);g.gain.exponentialRampToValueAtTime(.001,n+.35);o.start(n);o.stop(n+.35)}
  };if(s[type])s[type]();
}
function toggleSound(){soundEnabled=!soundEnabled;document.getElementById('soundBtn').textContent=soundEnabled?'🔊':'🔇';showToast(soundEnabled?'Sound ON':'Sound OFF');if(soundEnabled)playSound('click');localStorage.setItem('hashEmpireSound',soundEnabled?'1':'0')}

const COINS=[
  {id:'doge',name:'DOGE',icon:'Ð',color:'#c2a633',baseRate:1.2,amount:0,level:0,baseCost:12},
  {id:'usdt',name:'USDT',icon:'₮',color:'#26a17b',baseRate:0.55,amount:0,level:0,baseCost:35},
  {id:'eth',name:'ETH',icon:'Ξ',color:'#627eea',baseRate:0.22,amount:0,level:0,baseCost:100},
  {id:'btc',name:'BTC',icon:'₿',color:'#f7931a',baseRate:0.08,amount:0,level:0,baseCost:400}
];

// Promo codes are hidden from players – only you know them
const PROMO_CODES={
  'HASHSTART':{desc:'+80 of every coin',action:s=>s.coins.forEach(c=>c.amount+=80)},
  'WELCOME':{desc:'+300 DOGE + 2 Workers',action:s=>{s.coins[0].amount+=300;s.workers+=2}},
  'MINER2026':{desc:'+800 of all coins',action:s=>s.coins.forEach(c=>c.amount+=800)},
  'DOGEKING':{desc:'+3,500 DOGE',action:s=>s.coins[0].amount+=3500},
  'ETHPOWER':{desc:'+500 ETH + boost',action:s=>{s.coins[2].amount+=500;s.tempBoost=(s.tempBoost||1)*1.08}},
  'BTCHAUL':{desc:'+80 BTC',action:s=>s.coins[3].amount+=80},
  'PRESTIGE':{desc:'+5 Prestige Points',action:s=>s.prestigePoints+=5},
  'TEAMWORK':{desc:'+5 Workers',action:s=>s.workers+=5},
  'LEVELUP':{desc:'+800 XP',action:s=>s.xp+=800},
  'EMPIRE':{desc:'+1500 all + 3 PP',action:s=>{s.coins.forEach(c=>c.amount+=1500);s.prestigePoints+=3}},
  'SECRET':{desc:'Big starter pack',action:s=>{s.coins.forEach(c=>c.amount+=400);s.workers+=3;s.xp+=300}},
  'FRYMASTER':{desc:'Owner bonus +10 Workers',action:s=>{s.workers+=10;s.coins.forEach(c=>c.amount+=2000)}}
};

const IAP_PACKS=[
  {id:'starter',name:'Starter Pack',desc:'8,000 of each coin + 8 Workers',price:'$4.99',priceValue:4.99,cryptoPrice:'≈ 0.00008 BTC / 15 USDT',icon:'🎁',color:'#26a17b',effect:s=>{s.coins.forEach(c=>c.amount+=8000);s.workers+=8}},
  {id:'miner',name:'Miner Bundle',desc:'20 Workers + 40,000 DOGE + 5 PP',price:'$9.99',priceValue:9.99,cryptoPrice:'≈ 0.00015 BTC / 30 USDT',icon:'👷',color:'#7b61ff',effect:s=>{s.workers+=20;s.coins[0].amount+=40000;s.prestigePoints+=5}},
  {id:'boost',name:'Speed Boost',desc:'Permanent +30% mining speed',price:'$14.99',priceValue:14.99,cryptoPrice:'≈ 0.00025 BTC / 45 USDT',icon:'⚡',color:'#00d4ff',effect:s=>{s.shopMult+=0.30}},
  {id:'whale',name:'Whale Pack',desc:'150,000 all coins + 40 Workers + 20 PP',price:'$29.99',priceValue:29.99,cryptoPrice:'≈ 0.0005 BTC / 90 USDT',icon:'🐋',color:'#ffab00',best:true,effect:s=>{s.coins.forEach(c=>c.amount+=150000);s.workers+=40;s.prestigePoints+=20}},
  {id:'empire',name:'Empire Pack',desc:'700,000 all + 70 Workers + 50 PP + VIP',price:'$79.99',priceValue:79.99,cryptoPrice:'≈ 0.0013 BTC / 240 USDT',icon:'🏰',color:'#ff6b6b',effect:s=>{s.coins.forEach(c=>c.amount+=700000);s.workers+=70;s.prestigePoints+=50;s.shopMult+=0.20;s.isVip=true}},
  {id:'legendary',name:'Legendary Tycoon',desc:'3,000,000 all + 120 Workers + 120 PP + +60% speed',price:'$149.99',priceValue:149.99,cryptoPrice:'≈ 0.0025 BTC / 450 USDT',icon:'👑',color:'#ffd700',legendary:true,effect:s=>{s.coins.forEach(c=>c.amount+=3000000);s.workers+=120;s.prestigePoints+=120;s.shopMult+=0.60;s.isVip=true;s.adsRemoved=true}},
  {id:'removeads',name:'Remove Ads',desc:'No ads forever (when published)',price:'$5.99',priceValue:5.99,cryptoPrice:'≈ 0.0001 BTC / 18 USDT',icon:'🚫',color:'#ff5252',oneTime:true,effect:s=>{s.adsRemoved=true}},
  {id:'vip',name:'VIP Lifetime',desc:'+45% speed + golden name + 30 PP',price:'$39.99',priceValue:39.99,cryptoPrice:'≈ 0.0007 BTC / 120 USDT',icon:'🌟',color:'#ffd700',oneTime:true,effect:s=>{s.shopMult+=0.45;s.prestigePoints+=30;s.isVip=true}}
];

const SHOP_ITEMS=[
  {id:'mult1',name:'+12% Mining Speed',desc:'Permanent global multiplier',cost:2,max:25,effect:s=>s.shopMult+=0.12},
  {id:'mult2',name:'+30% Mining Speed',desc:'Bigger permanent boost',cost:5,max:12,effect:s=>s.shopMult+=0.30},
  {id:'workerP',name:'Stronger Workers',desc:'+1.2% extra per worker',cost:3,max:20,effect:s=>s.workerPower+=0.012},
  {id:'startCash',name:'Better Start',desc:'+150 of each coin on prestige',cost:4,max:8,effect:s=>s.startBonus=(s.startBonus||0)+150}
];

const CRYPTO_WALLETS={
  BTC:'bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh',
  ETH:'0x71C7656EC7ab88b098defB751B7401B5f6d8976F',
  USDT:'0x71C7656EC7ab88b098defB751B7401B5f6d8976F',
  DOGE:'D7Y55v3nM1q1g1g1g1g1g1g1g1g1g1g1g1g'
};

let state={coins:JSON.parse(JSON.stringify(COINS)),workers:0,prestige:0,prestigePoints:0,prestigeMult:1,shopMult:1,workerPower:0.05,tempBoost:1,totalMined:0,xp:0,level:1,lastSave:Date.now(),name:'CryptoBoss',totalEarned:0,usedCodes:{},shopBought:{},purchasedIAPs:{},adsRemoved:false,isVip:false,startBonus:0,totalRealSpent:0,totalCryptoSpent:0};
const WORKER_COST_BASE=200,PRESTIGE_BASE=6000;

function formatNum(n){if(n<1000)return n.toFixed(n<10?2:1);if(n<1e6)return(n/1e3).toFixed(2)+'K';if(n<1e9)return(n/1e6).toFixed(2)+'M';if(n<1e12)return(n/1e9).toFixed(2)+'B';if(n<1e15)return(n/1e12).toFixed(2)+'T';return(n/1e15).toFixed(2)+'Q'}
function getCoinRate(c){return c.baseRate*(1+c.level*0.38)*(1+state.workers*state.workerPower)*state.prestigeMult*state.shopMult*(state.tempBoost||1)}
function getUpgradeCost(c){return Math.floor(c.baseCost*Math.pow(1.42,c.level))}
function getWorkerCost(){return Math.floor(WORKER_COST_BASE*Math.pow(1.48,state.workers))}
function getTotalPerSec(){return state.coins.reduce((s,c)=>s+getCoinRate(c),0)}
function getXPNeeded(l){return Math.floor(90*Math.pow(1.38,l-1))}
function getPrestigeRequirement(){return Math.floor(PRESTIGE_BASE*Math.pow(2.6,state.prestige))}
function getPrestigePointsGain(){const r=getPrestigeRequirement(),ratio=state.totalMined/r;return Math.max(1,Math.floor(1+Math.log2(Math.max(1,ratio))*2.2+state.prestige*0.6))}

function tick(dt){const sec=dt/1000;let g=0;state.coins.forEach(c=>{const a=getCoinRate(c)*sec;c.amount+=a;g+=a});state.totalMined+=g;state.totalEarned+=g;state.xp+=g*0.85;checkLevelUp();updateUI()}
function checkLevelUp(){let n=getXPNeeded(state.level);while(state.xp>=n){state.xp-=n;state.level++;n=getXPNeeded(state.level);playSound('levelup');showToast('🎉 Level Up! Level '+state.level)}}
function upgradeCoin(id){const c=state.coins.find(x=>x.id===id);if(!c)return;const cost=getUpgradeCost(c);if(c.amount<cost){playSound('error');showToast('Not enough '+c.name);return}c.amount-=cost;c.level++;playSound('upgrade');showToast(c.name+' → Level '+c.level);saveGame();updateUI()}
function hireWorker(){const cost=getWorkerCost(),btc=state.coins.find(c=>c.id==='btc');if(btc.amount<cost){playSound('error');showToast('Need more BTC');return}btc.amount-=cost;state.workers++;playSound('hire');showToast('👷 Miner hired! Team: '+state.workers);saveGame();updateUI()}
function doPrestige(){const req=getPrestigeRequirement();if(state.totalMined<req){playSound('error');showToast('Not enough mined yet');return}const pts=getPrestigePointsGain();if(!confirm('Prestige now?\n\nYou will gain '+pts+' Prestige Points.\nCoins & workers reset.\nAll permanent upgrades stay.'))return;state.prestige++;state.prestigePoints+=pts;state.prestigeMult=1+state.prestige*0.18;state.coins.forEach(c=>{c.amount=state.startBonus||0;c.level=0});state.workers=0;state.totalMined=0;state.tempBoost=1;playSound('prestige');showToast('🚀 Prestiged! +'+pts+' PP');saveGame();updateUI()}
function buyShopItem(id){const item=SHOP_ITEMS.find(i=>i.id===id);if(!item)return;const bought=state.shopBought[id]||0;if(bought>=item.max){showToast('Maxed!');return}if(state.prestigePoints<item.cost){playSound('error');showToast('Not enough PP');return}state.prestigePoints-=item.cost;state.shopBought[id]=bought+1;item.effect(state);playSound('shop');showToast('Purchased: '+item.name);saveGame();updateUI();openModal('prestigeShop')}

function buyIAP(packId,method='card'){const pack=IAP_PACKS.find(p=>p.id===packId);if(!pack)return;if(pack.oneTime&&state.purchasedIAPs[packId]){showToast('Already owned');return}if(method==='crypto'){openCryptoPayment(pack);return}if(!confirm('Buy "'+pack.name+'" for '+pack.price+'?\n\n(Simulation – real payments come after Google Play launch)'))return;completePurchase(pack,'card')}
function openCryptoPayment(pack){document.getElementById('modalContent').innerHTML=`<h2>₿ Pay with Crypto</h2><p><strong>${pack.name}</strong></p><p style="color:var(--orange)">${pack.cryptoPrice}</p><div class="crypto-box"><div style="font-size:12px;color:var(--muted);margin-bottom:6px">Send to one of these addresses:</div><div style="text-align:left;font-size:12px;margin:8px 0"><strong style="color:#f7931a">BTC:</strong><div class="addr">${CRYPTO_WALLETS.BTC}</div></div><div style="text-align:left;font-size:12px;margin:8px 0"><strong style="color:#627eea">ETH / USDT:</strong><div class="addr">${CRYPTO_WALLETS.ETH}</div></div><div style="text-align:left;font-size:12px;margin:8px 0"><strong style="color:#c2a633">DOGE:</strong><div class="addr">${CRYPTO_WALLETS.DOGE}</div></div><p style="font-size:11px;color:var(--muted);margin-top:10px">After sending, tap the button below.</p></div><div class="pay-options"><button style="background:linear-gradient(135deg,#f7931a,#ffb347);color:#000" onclick="confirmCryptoPayment('${pack.id}')">I've Sent Crypto</button><button style="background:var(--card2);color:var(--text)" onclick="openModal('shop')">Cancel</button></div><p style="font-size:11px;color:var(--muted);margin-top:12px">Replace these example wallets with your real ones before taking real payments.</p>`}
function confirmCryptoPayment(packId){const pack=IAP_PACKS.find(p=>p.id===packId);if(!pack)return;if(!confirm('Confirm you sent payment for "'+pack.name+'"?\n\n(Currently simulated)'))return;completePurchase(pack,'crypto')}
function completePurchase(pack,method){pack.effect(state);state.purchasedIAPs[pack.id]=true;if(method==='crypto')state.totalCryptoSpent+=pack.priceValue;else state.totalRealSpent+=pack.priceValue;playSound('purchase');showToast('✅ '+pack.name+' unlocked!');saveGame();updateUI();openModal('shop')}
function saveName(){state.name=document.getElementById('playerName').value||'CryptoBoss';saveGame()}

function updateUI(){
  document.getElementById('coinsGrid').innerHTML=state.coins.map(coin=>{
    const rate=getCoinRate(coin),cost=getUpgradeCost(coin),can=coin.amount>=cost;
    return `<div class="coin-card"><div class="coin-header"><div class="coin-icon" style="background:${coin.color}22;color:${coin.color}">${coin.icon}</div><div><div class="coin-name">${coin.name}</div><div class="coin-rate">${formatNum(rate)}/s • Lv.${coin.level}</div></div></div><div class="coin-amount" style="color:${coin.color}">${formatNum(coin.amount)}</div><button class="upgrade-btn" ${can?'':'disabled'} onclick="upgradeCoin('${coin.id}')">Upgrade<br><span class="cost">Cost: ${formatNum(cost)} ${coin.name}</span></button></div>`;
  }).join('');
  document.getElementById('totalPerMin').textContent='$'+formatNum(getTotalPerSec()*60);
  document.getElementById('prestigeLevel').textContent=state.prestige;
  document.getElementById('workerCount').textContent=state.workers;
  document.getElementById('playerLevel').textContent=state.level;
  document.getElementById('playerName').value=state.name;
  document.getElementById('ppDisplay').textContent=state.prestigePoints;
  const needed=getXPNeeded(state.level);
  document.getElementById('xpText').textContent=formatNum(state.xp)+' / '+formatNum(needed);
  document.getElementById('xpFill').style.width=Math.min(100,(state.xp/needed)*100)+'%';
  if(state.isVip)document.getElementById('playerName').style.color='#ffd700';
  let wh='';for(let i=0;i<Math.min(state.workers,14);i++)wh+='<div class="worker active">👷</div>';
  if(state.workers===0)wh='<div class="worker">❓</div><div class="worker">❓</div><div class="worker">❓</div>';
  document.getElementById('workersVisual').innerHTML=wh;
  const wCost=getWorkerCost(),btc=state.coins.find(c=>c.id==='btc');
  const hireBtn=document.getElementById('hireBtn');
  hireBtn.innerHTML=`Hire Miner<br><span class="cost" style="font-size:11px">Cost: ${formatNum(wCost)} BTC</span>`;
  hireBtn.disabled=btc.amount<wCost;
  document.getElementById('hireInfo').textContent=`+${(state.workerPower*100).toFixed(1)}% per worker • Current +${(state.workers*state.workerPower*100).toFixed(0)}%`;
  const req=getPrestigeRequirement(),canP=state.totalMined>=req,pts=getPrestigePointsGain();
  const pBtn=document.getElementById('prestigeBtn');
  pBtn.disabled=!canP;pBtn.textContent=canP?`🚀 Prestige (+${pts} Points)`:`Need ${formatNum(req-state.totalMined)} more`;
  document.getElementById('currentMult').textContent='x'+(state.prestigeMult*state.shopMult).toFixed(2);
  document.getElementById('ppValue').textContent=state.prestigePoints;
  document.getElementById('prestigeDesc').textContent=`Next prestige at ${formatNum(req)} mined. Permanent upgrades are kept.`;
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}

function openModal(type){
  playSound('click');const content=document.getElementById('modalContent');let html='';
  if(type==='shop'){
    html=`<h2>🛒 Shop</h2><div class="notice">Purchases are currently simulated for testing. Real card payments will work after Google Play launch. Crypto can be connected sooner.</div><div class="shop-grid">`;
    IAP_PACKS.forEach(pack=>{
      const owned=pack.oneTime&&state.purchasedIAPs[pack.id];
      html+=`<div class="shop-card ${pack.best?'best':''} ${pack.legendary?'legendary':''}"><div class="shop-top"><div class="shop-icon" style="background:${pack.color}22">${pack.icon}</div><div class="shop-info"><div class="shop-name">${pack.name}${pack.best?' <span class="badge">BEST</span>':''}${pack.legendary?' <span class="badge gold">LEGENDARY</span>':''}</div><div class="shop-desc">${pack.desc}</div></div></div>`;
      if(owned)html+=`<button class="shop-price owned" disabled>Owned</button>`;
      else html+=`<div class="shop-buttons"><button class="shop-price" onclick="buyIAP('${pack.id}','card')">${pack.price}</button><button class="shop-price crypto" onclick="buyIAP('${pack.id}','crypto')">₿ Crypto</button></div>`;
      html+=`</div>`;
    });
    html+=`</div><p style="margin-top:12px;font-size:11px;color:var(--muted)">Simulated revenue — Card: $${state.totalRealSpent.toFixed(2)} • Crypto: $${state.totalCryptoSpent.toFixed(2)}</p>`;
  }else if(type==='stats'){
    html=`<h2>📊 Stats</h2><p><strong>Total Earned:</strong> $${formatNum(state.totalEarned)}</p><p><strong>Current Run:</strong> $${formatNum(state.totalMined)}</p><p><strong>Prestige:</strong> ${state.prestige} • Points: ${state.prestigePoints}</p><p><strong>Multiplier:</strong> x${(state.prestigeMult*state.shopMult).toFixed(2)}</p><p><strong>Workers:</strong> ${state.workers}</p><p><strong>Level:</strong> ${state.level}</p><p><strong>Hashrate:</strong> ${formatNum(getTotalPerSec())}/s</p>${state.isVip?'<p style="color:#ffd700">👑 VIP Active</p>':''}${state.adsRemoved?'<p style="color:var(--green)">🚫 Ads Removed</p>':''}`;
  }else if(type==='settings'){
    html=`<h2>⚙️ Settings</h2><div style="display:flex;justify-content:space-between;align-items:center;background:var(--card2);padding:12px;border-radius:10px;margin:10px 0"><span>Sound Effects</span><button onclick="toggleSound()" style="padding:6px 14px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700">${soundEnabled?'ON 🔊':'OFF 🔇'}</button></div><p>Progress is saved automatically on this device.</p><button class="modal-close" style="background:#ff5252;margin-top:10px" onclick="if(confirm('Delete ALL progress? This cannot be undone.')){localStorage.removeItem('hashEmpire');location.reload()}">Reset All Progress</button>`;
  }else if(type==='vault'){
    html=`<h2>💰 Vault</h2>${state.coins.map(c=>`<p><strong style="color:${c.color}">${c.name}:</strong> ${formatNum(c.amount)}</p>`).join('')}<p style="margin-top:12px;color:var(--green)">Your miners keep working while you are away (up to 2 days).</p>`;
  }else if(type==='codes'){
    html=`<h2>🎟️ Promo Codes</h2><p>Enter a secret promo code below. Codes can only be used once.</p><input id="codeInput" placeholder="ENTER CODE" style="width:100%;padding:13px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);margin:12px 0;font-size:16px;text-transform:uppercase;letter-spacing:1px"><button class="modal-close" style="background:linear-gradient(135deg,var(--accent),#0099cc);color:#000;margin:0" onclick="redeemCode()">Redeem Code</button><p style="margin-top:14px;font-size:12px;color:var(--muted)">Promo codes are private. Ask the developer for valid codes.</p>`;
  }else if(type==='prestigeShop'){
    html=`<h2>🛒 Prestige Shop</h2><p>You have <strong style="color:#c4b5fd">${state.prestigePoints} Prestige Points</strong></p>`;
    SHOP_ITEMS.forEach(item=>{const bought=state.shopBought[item.id]||0,maxed=bought>=item.max;
      html+=`<div class="shop-item"><div><div class="si-name">${item.name}</div><div class="si-desc">${item.desc} (${bought}/${item.max})</div></div><button ${maxed||state.prestigePoints<item.cost?'disabled':''} onclick="buyShopItem('${item.id}')">${maxed?'MAX':item.cost+' PP'}</button></div>`;
    });
  }else if(type==='about'){
    html=`<h2>ℹ️ Hash Empire</h2><p>An idle crypto miner with prestige system, workers, and upgrades.</p><p><strong>How to play:</strong></p><p>• Coins mine automatically<br>• Upgrade coins for higher rates<br>• Hire workers for global boosts<br>• Prestige for permanent power<br>• Use the Prestige Shop wisely</p><p style="margin-top:12px;font-size:12px">This is a prototype being prepared for Google Play Store.</p>`;
  }
  content.innerHTML=html+`<button class="modal-close" onclick="closeModal()">Close</button>`;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(e){if(e&&e.target!==document.getElementById('modalOverlay')&&e.type==='click')return;document.getElementById('modalOverlay').classList.remove('show')}
function redeemCode(){const code=(document.getElementById('codeInput')?.value||'').trim().toUpperCase();if(!code){showToast('Enter a code');return}const promo=PROMO_CODES[code];if(!promo){playSound('error');showToast('Invalid code');return}if(state.usedCodes[code]){playSound('error');showToast('Already used');return}promo.action(state);state.usedCodes[code]=true;playSound('code');showToast('✅ Code redeemed!');saveGame();updateUI();closeModal()}

function saveGame(){state.lastSave=Date.now();localStorage.setItem('hashEmpire',JSON.stringify(state))}
function loadGame(){const raw=localStorage.getItem('hashEmpire');if(!raw)return;try{const saved=JSON.parse(raw);state={...state,...saved};state.coins=COINS.map(base=>{const s=saved.coins?.find(c=>c.id===base.id)||{};return{...base,...s}});if(!state.shopBought)state.shopBought={};if(!state.usedCodes)state.usedCodes={};if(!state.purchasedIAPs)state.purchasedIAPs={};if(state.workerPower===undefined)state.workerPower=0.05;if(state.shopMult===undefined)state.shopMult=1}catch(e){}if(localStorage.getItem('hashEmpireSound')==='0'){soundEnabled=false;document.getElementById('soundBtn').textContent='🔇'}}
function calculateOffline(){const diff=Date.now()-(state.lastSave||Date.now());if(diff<12000)return;const sec=Math.min(diff/1000,86400*2);let totalGain=0;state.coins.forEach(c=>{const a=getCoinRate(c)*sec;c.amount+=a;totalGain+=a});state.totalMined+=totalGain;state.totalEarned+=totalGain;state.xp+=totalGain*0.85;checkLevelUp();if(totalGain>1){document.getElementById('modalContent').innerHTML=`<h2>🌙 Welcome Back!</h2><p>You were away for ${formatTime(sec)}</p><div class="offline-gain">+$${formatNum(totalGain)}</div><p>Your miners kept working.</p><button class="modal-close" onclick="closeModal()">Collect!</button>`;document.getElementById('modalOverlay').classList.add('show');playSound('code')}saveGame()}
function formatTime(sec){if(sec<60)return Math.floor(sec)+' seconds';if(sec<3600)return Math.floor(sec/60)+' minutes';if(sec<86400)return Math.floor(sec/3600)+' hours';return Math.floor(sec/86400)+' days'}

loadGame();calculateOffline();updateUI();
let last=performance.now();function loop(now){const dt=Math.min(now-last,80);last=now;tick(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
setInterval(saveGame,10000);window.addEventListener('beforeunload',saveGame);document.body.addEventListener('click',()=>initAudio(),{once:true});
</script>
</body>
</html>
